<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="capa-fondo" aria-hidden="true">
    <img id="fondo-img" alt="">
    <div class="velo"></div>
  </div>
  <canvas id="neon" class="neon" aria-hidden="true"></canvas>

  <div id="reloj" class="reloj" aria-hidden="true">
    <span id="reloj-fecha" class="reloj-fecha"></span>
    <span id="reloj-hora" class="reloj-hora"></span>
  </div>

  <main class="escena">
    <section id="vacio" class="vacio">
      <h1>No hay música sonando</h1>
      <p>Abre Spotify, Apple Music, YouTube Music o cualquier app de música y dale play. Aura la detecta sola.</p>
    </section>

    <section id="actual" class="actual" hidden>
      <div class="portada-marco">
        <img id="portada" class="portada" alt="">
        <div id="portada-vacia" class="portada-vacia" aria-hidden="true">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>
      <div class="datos">
        <h1 id="titulo"></h1>
        <p id="artista" class="artista"></p>
        <p id="album" class="album"></p>
      </div>
    </section>
    <section id="carrusel" class="carrusel" hidden aria-label="Canciones recientes">
      <div class="carrusel-fila">
        <button id="car-prev" class="carrusel-flecha" aria-label="Canción anterior del historial">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="pista" class="pista"></div>
        <button id="car-next" class="carrusel-flecha" aria-label="Canción siguiente del historial">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="carrusel-info">
        <p id="car-estado" class="car-estado"></p>
        <h2 id="car-titulo" class="car-titulo"></h2>
        <p id="car-artista" class="car-artista"></p>
      </div>
    </section>

    <section id="constelacion" class="constelacion" hidden aria-hidden="true"></section>

    <section id="letra" class="letra" hidden aria-live="off">
      <div id="letra-lineas" class="letra-lineas"></div>
    </section>
  </main>

  <nav class="barra" aria-label="Controles de reproducción">
    <div class="fuente-wrap">
      <button id="btn-fuente" class="fuente" aria-haspopup="true" aria-expanded="false" aria-controls="menu-fuente">
        <span id="fuente-icono" class="icono-app">?</span>
        <span id="fuente-nombre" class="fuente-nombre">Buscando…</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <div id="menu-fuente" class="menu" hidden>
        <p class="menu-titulo">Escuchar desde</p>
        <div id="lista-fuentes"></div>
      </div>
    </div>

    <div class="controles">
      <button id="btn-prev" class="btn-icono" aria-label="Anterior">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20 9 12l10-8v16z"/><rect x="4" y="5" width="2.5" height="14" rx="1"/></svg>
      </button>
      <button id="btn-play" class="btn-play" aria-label="Reproducir">
        <svg class="ic-play" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
        <svg class="ic-pausa" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button id="btn-next" class="btn-icono" aria-label="Siguiente">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m5 4 10 8-10 8V4z"/><rect x="17.5" y="5" width="2.5" height="14" rx="1"/></svg>
      </button>
    </div>

    <div class="progreso">
      <span id="t-actual" class="tiempo">0:00</span>
      <input id="barra-tiempo" type="range" min="0" max="1000" value="0" step="1" aria-label="Posición de la canción">
      <span id="t-total" class="tiempo">0:00</span>
    </div>

    <button id="btn-chat" class="btn-modo" aria-pressed="false" aria-label="Platicar con Aura">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
    </button>
    <button id="btn-efectos" class="btn-modo" aria-pressed="true" aria-label="Efectos: completos">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    </button>
    <button id="btn-escena" class="btn-modo" aria-label="Cambiar escena">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
    </button>
    <button id="btn-carrusel" class="btn-modo" aria-pressed="false" aria-label="Mostrar carrusel">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="14" rx="2"/><path d="M2 7v10M22 7v10"/></svg>
    </button>
    <button id="btn-letra" class="btn-modo" aria-pressed="true" aria-label="Mostrar letra" disabled>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
    </button>
  </nav>

  <aside id="chat" class="chat" hidden aria-label="Chat con Aura">
    <header class="chat-cabeza">
      <h2>Aura</h2>
      <button id="chat-cerrar" class="btn-icono" aria-label="Cerrar chat">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div id="chat-mensajes" class="chat-mensajes" aria-live="polite"></div>
    <div id="chat-sugerencias" class="chat-sugerencias"></div>
    <form id="chat-form" class="chat-form">
      <label for="chat-texto" class="solo-lector">Escribe a Aura</label>
      <input id="chat-texto" type="text" autocomplete="off" placeholder="Escríbele a Aura…">
      <button id="chat-enviar" class="btn-icono enviar" aria-label="Enviar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </aside>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
