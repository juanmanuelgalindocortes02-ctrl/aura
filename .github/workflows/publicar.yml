# Arma el instalador de Windows y lo publica en GitHub Releases.
# Se ejecuta cuando subes una etiqueta de versión, por ejemplo v0.1.0.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aura ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador que termina en -setup.exe."
          releaseDraft: false
          prerelease: false
